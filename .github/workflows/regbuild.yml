name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tools
        run: |
          M=https://repo1.maven.org/maven2
          wget -q -O smali.jar   $M/org/smali/smali/2.5.2/smali-2.5.2.jar
          wget -q -O dexlib2.jar $M/org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar
          wget -q -O guava.jar   $M/com/google/guava/guava/31.1-jre/guava-31.1-jre.jar
          wget -q -O jcmd.jar    $M/com/beust/jcommander/1.78/jcommander-1.78.jar
          wget -q -O antlr.jar   $M/org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2.jar
          wget -q -O kotlin.jar  $M/org/jetbrains/kotlin/kotlin-stdlib/1.6.10/kotlin-stdlib-1.6.10.jar

      - name: Build regtool dex
        run: |
          mkdir -p regtree/com/eta/dseek
          cp regtool/RegTool.smali regtree/com/eta/dseek/
          CP=smali.jar:dexlib2.jar:guava.jar:jcmd.jar:antlr.jar:kotlin.jar
          java -cp "$CP" org.jf.smali.Main -o regtool.dex regtree
          ls -l regtool.dex

      - name: Commit dex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f regtool.dex
          git commit -m "build regtool dex" || true
          git push origin main || true
